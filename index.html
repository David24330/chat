<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre chat 🐱</title>
<style>
:root{--bg:#fdf3e3;--card:#fff;--tx:#3b2f2f;--mut:#8a7a70;--ac:#e8743b;--bar:#eadfd2;--ok:#4caf7a;--warn:#e8b13b;--bad:#d9534f;--w1:#ffe3c2;--w2:#ffd0a1;--fl:#c98f5a}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a17;--card:#2b2420;--tx:#f3e9df;--mut:#b3a396;--bar:#3d332d;--w1:#4a3a5e;--w2:#33284a;--fl:#5a4030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{width:100%;max-width:480px;padding:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:1rem}
.coin{background:var(--warn);color:#3b2f2f;border-radius:20px;padding:4px 12px;font-weight:700}
.room{position:relative;margin:10px 0;border-radius:16px;overflow:hidden;height:250px;background:linear-gradient(var(--w1),var(--w2) 68%,var(--fl) 68%)}
.room::before{content:"🪟";position:absolute;left:14px;top:12px;font-size:44px}
.room::after{content:"🪴";position:absolute;right:14px;top:128px;font-size:50px}
.cat{position:absolute;left:50%;bottom:6px;width:230px;margin-left:-115px;animation:b 2.4s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-6px)}}
#tail{transform-origin:150px 150px;animation:w 1.6s ease-in-out infinite}
@keyframes w{50%{transform:rotate(14deg)}}
.eye{transform-origin:100px 93px;animation:bl 4s infinite}
@keyframes bl{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mood{text-align:center;font-weight:600}
.sub{color:var(--mut);font-size:.85rem;text-align:center;margin:4px 0}
.stat{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88rem}
.stat span{width:95px}
.bar{flex:1;height:12px;background:var(--bar);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;border:0;border-radius:14px;padding:12px 6px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.4}
button.alt{background:var(--bar);color:var(--tx)}
button small{display:block;font-weight:500;font-size:.72rem;margin-top:2px}
input{font:inherit;width:100%;padding:11px;border-radius:12px;border:2px solid var(--bar);background:var(--bg);color:var(--tx);margin:6px 0}
ul{list-style:none;margin:6px 0 0;padding:0;font-size:.82rem;color:var(--mut)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:14px;z-index:9}
#modal.on{display:flex}
#mb{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
h2{font-size:1.05rem;margin:0 0 10px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid button{font-size:1.8rem}
.grid button.alt{font-size:1.8rem}
#arena{position:relative;height:260px;background:var(--bar);border-radius:14px;overflow:hidden}
.mouse{position:absolute;font-size:34px;background:none;padding:0;width:44px;height:44px;animation:pop .2s}
@keyframes pop{from{transform:scale(0)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
.msg{text-align:center;color:var(--mut);padding:24px 8px}
</style>
</head>
<body>
<main id="app"><div class="msg">Chargement…</div></main>
<div id="modal"><div id="mb"></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) COLLE ICI TA CONFIG FIREBASE ====== */
const firebaseConfig = {
    apiKey: "AIzaSyCf39yHQJIdA5OCsYjD64K8HHMw-sm4PQk",
    authDomain: "pet-online-9ea37.firebaseapp.com",
    databaseURL: "https://pet-online-9ea37-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "pet-online-9ea37",
    storageBucket: "pet-online-9ea37.firebasestorage.app",
    messagingSenderId: "319836292942",
    appId: "1:319836292942:web:e7b7905a893cf13c1b801f"
  };
/* ============================================= */

const RATES={food:6,joy:4,energy:3,clean:2};
const LAB={food:"🍖 Faim",joy:"🧶 Joie",energy:"⚡ Énergie",clean:"🛁 Propreté"};
const FOODS={kib:{e:"🥣",n:"Croquettes",p:3,d:{food:20}},fish:{e:"🐟",n:"Poisson",p:6,d:{food:35,joy:5}},milk:{e:"🥛",n:"Lait",p:4,d:{food:15,joy:10}},cake:{e:"🍰",n:"Gâteau",p:10,d:{food:25,joy:25,clean:-5}}};
const ACC={bow:{e:"🎀",n:"Nœud",p:15},hat:{e:"🎩",n:"Chapeau",p:25},glasses:{e:"🕶️",n:"Lunettes",p:20}};
const $=i=>document.getElementById(i), clamp=v=>Math.max(0,Math.min(100,v));
let D=null,db,ref,busy=false,modalFn=null,stop=null,nick="",chosenName="";
try{nick=localStorage.getItem("nick")||""}catch(e){}

const cur=d=>{const h=(Date.now()-d.t)/36e5,o={};for(const k in RATES)o[k]=clamp(d[k]-RATES[k]*h);return o};
const col=v=>v>55?"var(--ok)":v>25?"var(--warn)":"var(--bad)";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=s=>(s.food+s.joy+s.energy+s.clean)/4;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2500)}
function moodTxt(s){if(s.energy<15)return"💤 Il dort debout…";if(s.food<15)return"😿 Il a très faim !";const a=avg(s);return a>70?"😸 Il ronronne de bonheur":a>45?"🐱 Ça va bien":a>25?"😾 Il a besoin de vous":"😿 Il va très mal…"}

function cat(s,w){
 const a=avg(s),sl=s.energy<15;
 const eyes=sl?'<path d="M78 92q8 8 16 0M106 92q8 8 16 0" stroke="#3b2f2f" stroke-width="3" fill="none" stroke-linecap="round"/>':
 '<g class="eye"><circle cx="86" cy="92" r="9" fill="#fff"/><circle cx="114" cy="92" r="9" fill="#fff"/><circle cx="86" cy="93" r="5" fill="#222"/><circle cx="114" cy="93" r="5" fill="#222"/><circle cx="88" cy="91" r="1.7" fill="#fff"/><circle cx="116" cy="91" r="1.7" fill="#fff"/></g>';
 const mouth=a>55?"M90 113q10 11 20 0":a>35?"M92 116h16":"M92 122q8-9 16 0";
 return '<svg viewBox="0 0 200 200"><path id="tail" d="M146 156q42-6 32-60" stroke="#e8923f" stroke-width="15" fill="none" stroke-linecap="round"/>'+
 '<ellipse cx="100" cy="150" rx="54" ry="42" fill="#f0a04b"/><ellipse cx="100" cy="158" rx="30" ry="28" fill="#ffe0b8"/>'+
 '<ellipse cx="78" cy="190" rx="16" ry="9" fill="#f7b968"/><ellipse cx="122" cy="190" rx="16" ry="9" fill="#f7b968"/>'+
 '<polygon points="62,70 66,32 94,58" fill="#f0a04b"/><polygon points="138,70 134,32 106,58" fill="#f0a04b"/>'+
 '<polygon points="68,62 70,42 86,57" fill="#f6a5b0"/><polygon points="132,62 130,42 114,57" fill="#f6a5b0"/>'+
 '<circle cx="100" cy="95" r="44" fill="#f0a04b"/><path d="M100 52v16M86 54l4 12M114 54l-4 12" stroke="#d9792a" stroke-width="4" stroke-linecap="round"/>'+
 eyes+'<path d="M95 104h10l-5 6z" fill="#e8667a"/><path d="'+mouth+'" stroke="#3b2f2f" stroke-width="3" fill="none" stroke-linecap="round"/>'+
 '<path d="M60 102l-22-4M60 108l-22 4M140 102l22-4M140 108l22 4" stroke="#3b2f2f" stroke-width="2" stroke-linecap="round"/>'+
 (w.bow?'<text x="100" y="146" font-size="34" text-anchor="middle">🎀</text>':'')+
 (w.glasses?'<text x="100" y="104" font-size="52" text-anchor="middle">🕶️</text>':'')+
 (w.hat?'<text x="100" y="62" font-size="46" text-anchor="middle">🎩</text>':'')+
 (sl?'<text x="150" y="50" font-size="26">💤</text>':'')+'</svg>'}

function render(){
 if(!ref){$("app").innerHTML='<div class="card msg">⚙️ Il faut d’abord coller ta configuration Firebase dans <b>index.html</b> (voir les instructions).</div>';return}
 if(!D){$("app").innerHTML='<div class="card"><h2>🥚 Un chaton vient d’arriver !</h2><div class="room"><div class="cat">'+cat({food:80,joy:80,energy:80,clean:80},{})+'</div></div><input id="cn" maxlength="20" placeholder="Comment l’appelle-t-on ?" value="'+esc(chosenName)+'"><button style="width:100%" id="adopt">Adopter ce chat</button></div>';
  $("cn").oninput=e=>chosenName=e.target.value;
  $("adopt").onclick=()=>{const n=chosenName.trim()||"Minou",t=Date.now();setDoc(ref,{name:n,born:t,t,food:80,joy:80,energy:80,clean:80,coins:10,inv:{kib:2},own:{},wear:{},log:[]}).catch(e=>toast("Erreur : "+e.code))};return}
 const s=cur(D),days=Math.floor((Date.now()-D.born)/864e5)+1;
 $("app").innerHTML='<div class="card"><div class="top"><b>'+esc(D.name)+' · jour '+days+'</b><span class="coin">🪙 '+(D.coins||0)+'</span></div>'+
 '<div class="room"><div class="cat">'+cat(s,D.wear||{})+'</div></div><div class="mood">'+moodTxt(s)+'</div>'+
 Object.keys(LAB).map(k=>'<div class="stat"><span>'+LAB[k]+'</span><div class="bar"><i style="width:'+Math.round(s[k])+'%;background:'+col(s[k])+'"></i></div></div>').join("")+'</div>'+
 '<div class="card"><div class="btns"><button data-m="feed">🍽️<small>Nourrir</small></button><button data-m="play">🎮<small>Jouer</small></button><button data-m="shop">🛍️<small>Boutique</small></button><button data-a="sleep">😴<small>Dormir</small></button><button data-a="wash">🛁<small>Laver</small></button></div></div>'+
 '<div class="card"><b>Derniers soins</b><ul>'+((D.log||[]).slice().reverse().map(l=>'<li>'+new Date(l.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+' — <b>'+esc(l.w)+'</b> '+esc(l.x)+'</li>').join("")||"<li>Rien pour l’instant</li>")+'</ul></div>'+
 '<div class="card"><div class="sub" style="text-align:left">Ton prénom (affiché dans l’historique)</div><input id="nick" maxlength="20" value="'+esc(nick)+'" placeholder="Ton prénom"></div>'+
 '<p class="sub"><a href="#" id="reset" style="color:var(--mut)">Adopter un autre chat</a></p>';
 $("nick").oninput=e=>{nick=e.target.value;try{localStorage.setItem("nick",nick)}catch(x){}};
 $("reset").onclick=e=>{e.preventDefault();if(confirm("Remplacer "+D.name+" par un nouveau chat ?"))deleteDoc(ref)};
}

async function tx(fn){
 if(busy)return false;busy=true;
 try{await runTransaction(db,async t=>{
  const sn=await t.get(ref);if(!sn.exists())throw Error("Pas de chat");
  const d=sn.data(),n={...d,...cur(d),t:Date.now(),inv:{...d.inv},own:{...d.own},wear:{...d.wear}};
  const x=fn(n);n.log=(d.log||[]).concat([{w:nick||"Quelqu’un",x,t:Date.now()}]).slice(-8);t.set(ref,n)});
  busy=false;return true}
 catch(e){busy=false;toast(e.message||"Erreur");return false}}
const apply=(n,d)=>{for(const k in d)n[k]=clamp(n[k]+d[k])};

function openModal(fn){modalFn=fn;$("modal").classList.add("on");fn()}
function closeModal(){if(stop){stop();stop=null}modalFn=null;$("modal").classList.remove("on")}

function feedUI(){$("mb").innerHTML='<h2>Que lui donner ?</h2><div class="grid">'+Object.keys(FOODS).map(k=>{const f=FOODS[k],c=(D.inv||{})[k]||0;return '<button data-f="'+k+'"'+(c?"":" disabled")+'>'+f.e+'<small>'+f.n+' ×'+c+'</small></button>'}).join("")+'</div><p class="sub">Plus de nourriture ? Va à la boutique !</p><button class="alt" style="width:100%" data-x>Fermer</button>'}
function shopUI(){const c=D.coins||0;$("mb").innerHTML='<h2>🛍️ Boutique — 🪙 '+c+'</h2><div class="sub">Nourriture</div><div class="grid">'+Object.keys(FOODS).map(k=>{const f=FOODS[k];return '<button data-b="f:'+k+'"'+(c<f.p?" disabled":"")+'>'+f.e+'<small>'+f.n+' · 🪙'+f.p+'</small></button>'}).join("")+'</div><div class="sub">Accessoires</div><div class="grid">'+Object.keys(ACC).map(k=>{const a=ACC[k];return (D.own||{})[k]?'<button class="alt" data-w="'+k+'">'+a.e+'<small>'+(D.wear&&D.wear[k]?"Retirer":"Porter")+'</small></button>':'<button data-b="a:'+k+'"'+(c<a.p?" disabled":"")+'>'+a.e+'<small>'+a.n+' · 🪙'+a.p+'</small></button>'}).join("")+'</div><button class="alt" style="width:100%" data-x>Fermer</button>'}
function playUI(){$("mb").innerHTML='<h2>À quoi on joue ?</h2><div class="grid"><button data-g="mouse">🐭<small>Attrape-souris</small></button><button data-g="simon">🥣<small>Mémoire des gamelles</small></button></div><button class="alt" style="width:100%" data-x>Fermer</button>'}

async function finish(score,mult){
 if(stop){stop();stop=null}
 const coins=Math.min(score*mult,25);
 const ok=await tx(n=>{n.coins=(n.coins||0)+coins;apply(n,{joy:Math.min(40,10+score*3),energy:-10});return "a joué (score "+score+", +"+coins+" 🪙)"});
 $("mb").innerHTML='<h2>🎉 Score : '+score+'</h2><p class="sub">'+(ok?'+'+coins+' 🪙 · le chat est content !':'Impossible d’enregistrer')+'</p><button style="width:100%" data-x>OK</button>'}

function mouseGame(){
 let s=0,t=15;$("mb").innerHTML='<h2>Attrape les souris ! <span id="gs">0</span> 🐭 · <span id="gt">15</span>s</h2><div id="arena"></div>';
 const ar=$("arena");
 const sp=setInterval(()=>{const m=document.createElement("button");m.className="mouse";m.textContent="🐭";m.style.left=Math.random()*84+"%";m.style.top=Math.random()*80+"%";m.onclick=()=>{s++;$("gs").textContent=s;m.remove()};ar.appendChild(m);setTimeout(()=>m.remove(),950)},600);
 const tm=setInterval(()=>{t--;$("gt").textContent=t;if(t<=0)finish(s,1)},1000);
 stop=()=>{clearInterval(sp);clearInterval(tm)}}

function simon(){
 const C=["#e8743b","#4caf7a","#4a90d9","#d9b13b"],E=["🥣","🐟","🥛","🍗"];let seq=[],i=0,lock=true,alive=true;
 $("mb").innerHTML='<h2>Mémoire des gamelles — manche <span id="gs">0</span></h2><div class="grid">'+C.map((c,j)=>'<button data-s="'+j+'" style="background:'+c+'">'+E[j]+'</button>').join("")+'</div><p class="sub" id="gm">Regarde…</p>';
 const bs=[...document.querySelectorAll("[data-s]")],wait=ms=>new Promise(r=>setTimeout(r,ms));
 const flash=async j=>{bs[j].style.filter="brightness(1.7)";bs[j].style.transform="scale(1.1)";await wait(380);bs[j].style.filter="";bs[j].style.transform="";await wait(180)};
 async function round(){seq.push(Math.floor(Math.random()*4));lock=true;i=0;$("gm").textContent="Regarde…";await wait(600);for(const j of seq){if(!alive)return;await flash(j)}lock=false;if(alive)$("gm").textContent="À toi !"}
 bs.forEach((b,j)=>b.onclick=async()=>{if(lock)return;flash(j);if(j!==seq[i]){alive=false;lock=true;finish(seq.length-1,2);return}i++;if(i===seq.length){$("gs").textContent=seq.length;lock=true;await wait(500);if(alive)round()}});
 stop=()=>{alive=false};round()}

document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b||!D)return;const q=b.dataset;
 if(q.x!==undefined)closeModal();
 else if(q.m)openModal({feed:feedUI,play:playUI,shop:shopUI}[q.m]);
 else if(q.a){const A={sleep:[{energy:40,food:-5},"l’a mis au dodo 😴"],wash:[{clean:40,joy:-5},"l’a lavé 🛁"]}[q.a];tx(n=>{apply(n,A[0]);return A[1]})}
 else if(q.f){const f=FOODS[q.f];if(await tx(n=>{if(!(n.inv[q.f]>0))throw Error("Plus de "+f.n);n.inv[q.f]--;apply(n,f.d);return "a donné "+f.n+" "+f.e}))closeModal()}
 else if(q.b){const[t,k]=q.b.split(":"),it=t==="f"?FOODS[k]:ACC[k];tx(n=>{if((n.coins||0)<it.p)throw Error("Pas assez de pièces");n.coins-=it.p;if(t==="f")n.inv[k]=(n.inv[k]||0)+1;else{n.own[k]=true;n.wear[k]=true}return "a acheté "+it.n+" "+it.e})}
 else if(q.w)tx(n=>{n.wear[q.w]=!n.wear[q.w];return (n.wear[q.w]?"a mis ":"a retiré ")+ACC[q.w].n});
 else if(q.g){modalFn=null;q.g==="mouse"?mouseGame():simon()}
});

if(!firebaseConfig.apiKey.startsWith("COLLE")){
 db=getFirestore(initializeApp(firebaseConfig));ref=doc(db,"pet","main");
 onSnapshot(ref,sn=>{D=sn.exists()?sn.data():null;const a=document.activeElement;if(!(a&&a.tagName==="INPUT"&&a.value))render();if(modalFn)modalFn()},
  e=>{$("app").innerHTML='<div class="card msg">Connexion impossible ('+esc(e.code||"erreur")+'). Vérifie les règles Firestore.</div>'});
}
setInterval(()=>{const a=document.activeElement;if(D&&!(a&&a.tagName==="INPUT"))render()},30000);
render();
</script>
</body>
</html>
