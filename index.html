<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre famille de chats 🐱</title>
<style>
:root{--bg:#fdf3e3;--card:#fff;--tx:#3b2f2f;--mut:#8a7a70;--ac:#e8743b;--bar:#eadfd2;--ok:#4caf7a;--warn:#e8b13b;--bad:#d9534f;--s1:#8fd3ff;--s2:#ffe9c7;--fl:#d79c66}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a17;--card:#2b2420;--tx:#f3e9df;--mut:#b3a396;--bar:#3d332d;--s1:#1b1f4a;--s2:#4a3a6e;--fl:#5a4030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{width:100%;max-width:480px;padding:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.top{display:flex;justify-content:space-between;align-items:center}
.coin{background:var(--warn);color:#3b2f2f;border-radius:20px;padding:4px 12px;font-weight:700}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:8px 4px;font-size:.8rem}
.room{position:relative;margin:10px 0;border-radius:18px;overflow:hidden;height:270px;background:linear-gradient(var(--s1),var(--s2) 66%,var(--fl) 66%)}
.sun{position:absolute;right:16px;top:12px;font-size:40px;animation:b 5s infinite}
.win{position:absolute;left:14px;top:14px;font-size:46px}
.rug{position:absolute;left:50%;bottom:6px;width:210px;height:34px;margin-left:-105px;border-radius:50%;background:rgba(255,120,150,.45)}
.sp{position:absolute;font-size:14px;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}
.cat{position:absolute;left:50%;bottom:10px;width:230px;margin-left:-115px;animation:b 2.4s ease-in-out infinite}
.cat>div{transform-origin:50% 100%}
@keyframes b{50%{transform:translateY(-6px)}}
#tail{transform-origin:146px 156px;animation:w 1.6s ease-in-out infinite}
@keyframes w{50%{transform:rotate(14deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fx{position:absolute;bottom:90px;font-size:22px;animation:up 1.4s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-130px);opacity:0}}
.mood{text-align:center;font-weight:600}
.sub{color:var(--mut);font-size:.85rem;text-align:center;margin:4px 0}
.stat{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88rem}
.stat span{width:95px}
.bar{flex:1;height:12px;background:var(--bar);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;border:0;border-radius:14px;padding:12px 6px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.4}
button.alt{background:var(--bar);color:var(--tx)}
button.sel{outline:3px solid var(--ac)}
button small{display:block;font-weight:500;font-size:.7rem;margin-top:2px}
input{font:inherit;width:100%;padding:11px;border-radius:12px;border:2px solid var(--bar);background:var(--bg);color:var(--tx);margin:5px 0}
ul{list-style:none;margin:6px 0 0;padding:0;font-size:.82rem;color:var(--mut)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:14px;z-index:9}
#modal.on{display:flex}
#mb{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
h2{font-size:1.05rem;margin:0 0 10px;text-align:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.g3{grid-template-columns:repeat(3,1fr)}
.g button{font-size:1.7rem}
#arena,#bath{position:relative;height:260px;background:var(--bar);border-radius:14px;overflow:hidden}
#bath{background:linear-gradient(#bfeaff,#e8f8ff)}
#bath .cat{animation:none}
.mouse{position:absolute;font-size:34px;background:none;padding:0;width:44px;height:44px;animation:pop .2s}
@keyframes pop{from{transform:scale(0)}}
.dirt{position:absolute;width:38px;height:38px;border-radius:50%;background:#7a5230;padding:0;font-size:18px;z-index:2}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
.msg{text-align:center;color:var(--mut);padding:24px 8px}
</style>
</head>
<body>
<main id="app"><div class="msg">Chargement…</div></main>
<div id="modal"><div id="mb"></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== COLLE ICI TA CONFIG FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCf39yHQJIdA5OCsYjD64K8HHMw-sm4PQk",
  authDomain: "pet-online-9ea37.firebaseapp.com",
  projectId: "pet-online-9ea37",
  storageBucket: "pet-online-9ea37.firebasestorage.app",
  messagingSenderId: "319836292942",
  appId: "1:319836292942:web:e7b7905a893cf13c1b801f"
};
/* ========================================== */

const MONTH=864e5; // 1 jour réel = 1 mois de chat (change cette valeur pour accélérer/ralentir)
const RATES={food:6,joy:4,energy:3,clean:2};
const LAB={food:"🍖 Faim",joy:"🧶 Joie",energy:"⚡ Énergie",clean:"🛁 Propreté"};
const COATS=[{n:"Orange",f:"#f0a04b",b:"#ffe0b8",s:"#d9792a",e:"#3fae6a"},{n:"Gris",f:"#9aa4b2",b:"#e6eaf0",s:"#6f7a8a",e:"#e8b13b"},{n:"Noir",f:"#40404c",b:"#6a6a78",s:"#25252d",e:"#e8c53b"},{n:"Blanc",f:"#fafafa",b:"#fff",s:"#d6d6de",e:"#4aa3df"},{n:"Crème",f:"#e8cfa8",b:"#fff3df",s:"#c9a874",e:"#4aa3df"},{n:"Roux foncé",f:"#c4622d",b:"#f3cfa8",s:"#8f3f18",e:"#5bbf6a"}];
const FOODS={kib:{e:"🥣",n:"Croquettes",p:3,d:{food:20}},pate:{e:"🥫",n:"Pâtée",p:5,d:{food:28}},fish:{e:"🐟",n:"Poisson",p:6,d:{food:35,joy:5}},milk:{e:"🥛",n:"Lait",p:4,d:{food:15,joy:10}},chick:{e:"🍗",n:"Poulet",p:8,d:{food:32,joy:5}},shrimp:{e:"🦐",n:"Crevette",p:9,d:{food:25,joy:15}},cake:{e:"🍰",n:"Gâteau",p:10,d:{food:25,joy:25,clean:-5}},herb:{e:"🌿",n:"Herbe à chat",p:7,d:{joy:35,energy:-5}}};
const ACC={bow:{e:"🎀",n:"Nœud",p:15},hat:{e:"🎩",n:"Chapeau",p:25},glasses:{e:"🕶️",n:"Lunettes",p:20},crown:{e:"👑",n:"Couronne",p:40},scarf:{e:"🧣",n:"Écharpe",p:18},cap:{e:"🧢",n:"Casquette",p:22},head:{e:"🎧",n:"Casque",p:30},flower:{e:"🌸",n:"Fleur",p:12}};
const NAMES=["Mimi","Luna","Nala","Chloé","Plume","Cannelle","Praline","Zoé","Perle","Câline"];
const $=i=>document.getElementById(i),clamp=v=>Math.max(0,Math.min(100,v)),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let auth,db,ref,user=null,D=null,busy=false,modalFn=null,stop=null,sel="",coatSel=0,chosenName="",unsub=null,mode="in",meet=[];

const age=c=>(Date.now()-c.born)/MONTH;
const stage=a=>a<6?"Chaton":a<12?"Jeune chat":"Adulte";
const why=c=>age(c)>=c.life?"de vieillesse":(c.food-RATES.food*(Date.now()-c.t)/36e5<-60?"de faim":"");
const cur=c=>{const h=(Date.now()-c.t)/36e5,o={};for(const k in RATES)o[k]=clamp(c[k]-RATES[k]*h);return o};
const avg=s=>(s.food+s.joy+s.energy+s.clean)/4;
const col=v=>v>55?"var(--ok)":v>25?"var(--warn)":"var(--bad)";
const who=()=>user.displayName||user.email.split("@")[0];
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600)}
function fx(e){const r=document.querySelector(".room");if(!r)return;for(let i=0;i<6;i++){const s=document.createElement("span");s.className="fx";s.textContent=e;s.style.left=25+Math.random()*50+"%";s.style.animationDelay=i*.1+"s";r.appendChild(s);setTimeout(()=>s.remove(),1700)}}
function moodTxt(s){if(s.energy<15)return"💤 Il dort debout…";if(s.food<15)return"😿 Il a très faim !";const a=avg(s);return a>70?"😸 Il ronronne de bonheur":a>45?"🐱 Ça va bien":a>25?"😾 Il a besoin de vous":"😿 Il va très mal…"}

function svgCat(c,s,w){
 const P=COATS[c.k||0],a=avg(s),sl=s.energy<15,L=P.s;
 const eye=x=>'<ellipse cx="'+x+'" cy="95" rx="11" ry="13" fill="'+P.e+'" stroke="#2b2118" stroke-width="2"/><ellipse cx="'+x+'" cy="97" rx="5.5" ry="9" fill="#1b1b24"/><circle cx="'+(x-3.5)+'" cy="90" r="3.8" fill="#fff"/><circle cx="'+(x+3.5)+'" cy="101" r="1.9" fill="#fff"/>';
 const eyes=sl?'<path d="M74 95q10 9 20 0M106 95q10 9 20 0" stroke="#2b2118" stroke-width="3" fill="none" stroke-linecap="round"/>':'<g class="eye">'+eye(84)+eye(116)+'</g>';
 const mouth=a>55?"M92 118q4 7 8 0q4 7 8 0":a>35?"M94 119h12":"M93 123q7-8 14 0";
 const o='stroke="#4a3426" stroke-width="2.5" stroke-linejoin="round"';
 return '<svg viewBox="0 0 200 200"><path id="tail" d="M146 156q44-6 34-62" stroke="'+L+'" stroke-width="16" fill="none" stroke-linecap="round"/>'+
 '<ellipse cx="100" cy="152" rx="54" ry="42" fill="'+P.f+'" '+o+'/><ellipse cx="100" cy="160" rx="30" ry="28" fill="'+P.b+'"/>'+
 '<path d="M62 140q-8 14 0 24M138 140q8 14 0 24" stroke="'+L+'" stroke-width="4" fill="none" stroke-linecap="round"/>'+
 '<ellipse cx="78" cy="191" rx="17" ry="9" fill="'+P.b+'" '+o+'/><ellipse cx="122" cy="191" rx="17" ry="9" fill="'+P.b+'" '+o+'/>'+
 '<polygon points="60,72 64,28 96,58" fill="'+P.f+'" '+o+'/><polygon points="140,72 136,28 104,58" fill="'+P.f+'" '+o+'/>'+
 '<polygon points="67,62 69,40 86,56" fill="#f6a5b0"/><polygon points="133,62 131,40 114,56" fill="#f6a5b0"/>'+
 '<circle cx="100" cy="97" r="46" fill="'+P.f+'" '+o+'/><path d="M100 53v16M85 55l4 12M115 55l-4 12" stroke="'+L+'" stroke-width="4" stroke-linecap="round"/>'+
 '<ellipse cx="82" cy="70" rx="14" ry="7" fill="#fff" opacity=".28"/><ellipse cx="100" cy="116" rx="20" ry="14" fill="'+P.b+'"/>'+
 eyes+'<ellipse cx="68" cy="110" rx="8" ry="5" fill="#ff7a90" opacity=".45"/><ellipse cx="132" cy="110" rx="8" ry="5" fill="#ff7a90" opacity=".45"/>'+
 '<path d="M95 106h10l-5 6z" fill="#e8667a"/><path d="'+mouth+'" stroke="#4a3426" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
 '<path d="M62 106l-24-5M62 112l-24 5M138 106l24-5M138 112l24 5" stroke="#4a3426" stroke-width="1.8" stroke-linecap="round"/>'+
 (w.scarf?'<text x="100" y="148" font-size="40" text-anchor="middle">🧣</text>':'')+(w.bow?'<text x="100" y="146" font-size="30" text-anchor="middle">🎀</text>':'')+
 (w.glasses?'<text x="100" y="108" font-size="50" text-anchor="middle">🕶️</text>':'')+(w.head?'<text x="100" y="92" font-size="92" text-anchor="middle">🎧</text>':'')+
 (w.hat?'<text x="100" y="62" font-size="46" text-anchor="middle">🎩</text>':'')+(w.cap?'<text x="100" y="66" font-size="46" text-anchor="middle">🧢</text>':'')+
 (w.crown?'<text x="100" y="52" font-size="38" text-anchor="middle">👑</text>':'')+(w.flower?'<text x="66" y="62" font-size="26" text-anchor="middle">🌸</text>':'')+
 (sl?'<text x="150" y="48" font-size="26">💤</text>':'')+'</svg>'}
const catBox=(c,s)=>{const sc=.5+.5*Math.min(1,age(c)/8);return '<div class="cat"><div style="transform:scale('+sc.toFixed(2)+')">'+svgCat(c,s,c.wear||{})+'</div></div>'};
function room(c,s){const h=new Date().getHours(),n=h<7||h>=20;return '<div class="room"><div class="win">'+(n?"🌃":"🪟")+'</div><div class="sun">'+(n?"🌙":"☀️")+'</div><span class="sp" style="left:30%;top:20%">✨</span><span class="sp" style="left:60%;top:35%;animation-delay:1s">✨</span><div class="rug"></div>'+catBox(c,s)+'</div>'}

function render(){
 const A=$("app");
 if(!auth){A.innerHTML='<div class="card msg">⚙️ Colle d’abord ta configuration Firebase dans <b>index.html</b> (voir les instructions).</div>';return}
 if(!user){A.innerHTML='<div class="card"><h2>🐱 Notre famille de chats</h2><p class="sub">Connecte-toi pour t’occuper des chats</p>'+(mode==="up"?'<input id="ps" maxlength="20" placeholder="Ton pseudo">':'')+'<input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password"><button style="width:100%" data-au="go">'+(mode==="up"?"Créer mon compte":"Se connecter")+'</button><p class="sub"><a href="#" data-au="sw" style="color:var(--mut)">'+(mode==="up"?"J’ai déjà un compte":"Créer un compte")+'</a></p></div>';return}
 const all=D?D.cats:[],live=all.filter(c=>!why(c));
 if(!D||!live.length){
  const dead=all.map(c=>({n:c.name,a:Math.floor(age(c)),w:why(c)||"…"})).concat(D?D.past||[]:[]);
  A.innerHTML='<div class="card">'+(dead.length?'<h2>🪦 Souvenirs</h2><ul>'+dead.slice(-5).map(p=>'<li>'+esc(p.n)+' — '+p.a+' mois, mort '+esc(p.w)+'</li>').join("")+'</ul><hr style="opacity:.2">':'')+
  '<h2>🥚 Un chaton vient d’arriver !</h2><div class="room">'+catBox({k:coatSel,born:Date.now()},{food:80,joy:80,energy:80,clean:80})+'</div><div class="g g3">'+COATS.map((p,i)=>'<button class="'+(i===coatSel?"sel":"alt")+'" data-coat="'+i+'" style="font-size:.8rem">'+p.n+'</button>').join("")+'</div><input id="cn" maxlength="20" placeholder="Comment l’appelle-t-on ?" value="'+esc(chosenName)+'"><button style="width:100%" data-adopt>Adopter ce chaton</button></div>';
  $("cn").oninput=e=>chosenName=e.target.value;return}
 if(!live.find(c=>c.id===sel))sel=live[0].id;
 const c=live.find(x=>x.id===sel),s=cur(c),a=age(c),adult=a>=8&&!c.mated;
 A.innerHTML='<div class="card"><div class="top"><b>'+esc(c.name)+' · '+stage(a)+' · '+Math.floor(a)+' mois</b><span class="coin">🪙 '+(D.coins||0)+'</span></div>'+
 (live.length>1?'<div class="tabs">'+live.map(x=>'<button class="'+(x.id===sel?"":"alt")+'" data-sel="'+x.id+'">'+esc(x.name)+'</button>').join("")+'</div>':'')+
 room(c,s)+'<div class="mood">'+moodTxt(s)+'</div>'+Object.keys(LAB).map(k=>'<div class="stat"><span>'+LAB[k]+'</span><div class="bar"><i style="width:'+Math.round(s[k])+'%;background:'+col(s[k])+'"></i></div></div>').join("")+
 '<p class="sub">Espérance de vie : environ '+c.life+' mois · il faut le nourrir avant 0 !</p></div>'+
 '<div class="card"><div class="btns"><button data-m="feed">🍽️<small>Nourrir</small></button><button data-m="play">🎮<small>Jouer</small></button><button data-m="wash">🛁<small>Laver</small></button><button data-a="sleep">😴<small>Dormir</small></button><button data-m="shop">🛍️<small>Boutique</small></button><button data-m="meet"'+(adult?"":" disabled")+'>💕<small>'+(c.mated?"Déjà papa":"Rencontre dès 8 mois")+'</small></button></div></div>'+
 '<div class="card"><b>Derniers soins</b><ul>'+((D.log||[]).slice().reverse().map(l=>'<li>'+new Date(l.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+' — <b>'+esc(l.w)+'</b> '+esc(l.x)+'</li>').join("")||"<li>Rien pour l’instant</li>")+'</ul></div>'+
 '<p class="sub">Connecté : <b>'+esc(who())+'</b> · <a href="#" data-au="out" style="color:var(--mut)">Déconnexion</a></p>';
}

async function tx(fn,fxE,id=sel){
 if(busy)return false;busy=true;
 try{await runTransaction(db,async t=>{
  const sn=await t.get(ref);if(!sn.exists())throw Error("Pas de chat");
  const d=sn.data(),n={...d,inv:{...d.inv},own:{...d.own},past:(d.past||[]).slice()},now=Date.now();
  n.cats=[];for(const c of d.cats){const r=why(c);if(r)n.past.push({n:c.name,a:Math.floor(age(c)),w:r});else n.cats.push({...c,...cur(c),t:now,wear:{...c.wear}})}
  n.past=n.past.slice(-10);const c=n.cats.find(x=>x.id===id);if(!c)throw Error("Ce chat n’est plus là");
  const x=fn(n,c);n.log=(d.log||[]).concat([{w:who(),x:c.name+" : "+x,t:now}]).slice(-8);t.set(ref,n)});
  busy=false;if(fxE)fx(fxE);return true}
 catch(e){busy=false;toast(e.message||"Erreur");return false}}
const apply=(c,d)=>{for(const k in d)c[k]=clamp(c[k]+d[k])};

function openModal(fn){modalFn=fn;$("modal").classList.add("on");fn()}
function closeModal(){if(stop){stop();stop=null}modalFn=null;$("modal").classList.remove("on")}
const X='<button class="alt" style="width:100%" data-x>Fermer</button>';
const cs=()=>D.cats.find(c=>c.id===sel);
function feedUI(){$("mb").innerHTML='<h2>Que lui donner ?</h2><div class="g g3">'+Object.keys(FOODS).map(k=>{const f=FOODS[k],n=(D.inv||{})[k]||0;return '<button data-f="'+k+'"'+(n?"":" disabled")+'>'+f.e+'<small>'+f.n+' ×'+n+'</small></button>'}).join("")+'</div><p class="sub">Plus de nourriture ? Direction la boutique !</p>'+X}
function shopUI(){const c=D.coins||0,w=cs().wear||{};$("mb").innerHTML='<h2>🛍️ Boutique — 🪙 '+c+'</h2><div class="sub">Nourriture</div><div class="g g3">'+Object.keys(FOODS).map(k=>{const f=FOODS[k];return '<button data-b="f:'+k+'"'+(c<f.p?" disabled":"")+'>'+f.e+'<small>'+f.n+' · 🪙'+f.p+'</small></button>'}).join("")+'</div><div class="sub">Accessoires pour '+esc(cs().name)+'</div><div class="g g3">'+Object.keys(ACC).map(k=>{const a=ACC[k];return (D.own||{})[k]?'<button class="alt" data-w="'+k+'">'+a.e+'<small>'+(w[k]?"Retirer":"Porter")+'</small></button>':'<button data-b="a:'+k+'"'+(c<a.p?" disabled":"")+'>'+a.e+'<small>'+a.n+' · 🪙'+a.p+'</small></button>'}).join("")+'</div>'+X}
function playUI(){$("mb").innerHTML='<h2>À quoi on joue ?</h2><div class="g g3"><button data-g="mouse">🐭<small>Souris</small></button><button data-g="fish">🎣<small>Pêche</small></button><button data-g="simon">🥣<small>Mémoire</small></button></div>'+X}
function meetUI(){if(!meet.length)meet=[0,1,2].map(()=>({n:NAMES[Math.floor(Math.random()*NAMES.length)],k:Math.floor(Math.random()*COATS.length)}));
 $("mb").innerHTML='<h2>💕 Des chattes sont venues te voir</h2><div class="g g3">'+meet.map((m,i)=>'<button data-mt="'+i+'" style="font-size:1rem"><span style="font-size:2rem">🐈</span><small>'+m.n+'<br>'+COATS[m.k].n+'</small></button>').join("")+'</div><p class="sub">Choisis-en une : un chaton naîtra, avec la couleur de l’un des parents.</p>'+X}

async function finish(score,mult){
 if(stop){stop();stop=null}const g=Math.min(score*mult,25);
 const ok=await tx((n,c)=>{n.coins=(n.coins||0)+g;apply(c,{joy:Math.min(40,10+score*3),energy:-10});return "a joué (score "+score+", +"+g+" 🪙)"},"❤️");
 $("mb").innerHTML='<h2>🎉 Score : '+score+'</h2><p class="sub">'+(ok?'+'+g+' 🪙 · le chat est content !':'Impossible d’enregistrer')+'</p><button style="width:100%" data-x>OK</button>'}
function tapGame(good,bad){
 let s=0,t=15;$("mb").innerHTML='<h2>'+good+' <span id="gs">0</span> · <span id="gt">15</span>s'+(bad?' · évite '+bad:'')+'</h2><div id="arena"></div>';const ar=$("arena");
 const sp=setInterval(()=>{const m=document.createElement("button"),b=bad&&Math.random()<.3;m.className="mouse";m.textContent=b?bad:good;m.style.left=Math.random()*84+"%";m.style.top=Math.random()*80+"%";m.onclick=()=>{s=Math.max(0,s+(b?-2:1));$("gs").textContent=s;m.remove()};ar.appendChild(m);setTimeout(()=>m.remove(),950)},600);
 const tm=setInterval(()=>{t--;$("gt").textContent=t;if(t<=0)finish(s,1)},1000);stop=()=>{clearInterval(sp);clearInterval(tm)}}
function simon(){
 const C=["#e8743b","#4caf7a","#4a90d9","#d9b13b"],E=["🥣","🐟","🥛","🍗"];let seq=[],i=0,lock=true,alive=true;
 $("mb").innerHTML='<h2>Mémoire des gamelles — manche <span id="gs">0</span></h2><div class="g">'+C.map((c,j)=>'<button data-s="'+j+'" style="background:'+c+'">'+E[j]+'</button>').join("")+'</div><p class="sub" id="gm">Regarde…</p>';
 const bs=[...document.querySelectorAll("[data-s]")],wait=ms=>new Promise(r=>setTimeout(r,ms));
 const flash=async j=>{bs[j].style.filter="brightness(1.7)";bs[j].style.transform="scale(1.1)";await wait(380);bs[j].style.filter="";bs[j].style.transform="";await wait(180)};
 async function round(){seq.push(Math.floor(Math.random()*4));lock=true;i=0;$("gm").textContent="Regarde…";await wait(600);for(const j of seq){if(!alive)return;await flash(j)}lock=false;if(alive)$("gm").textContent="À toi !"}
 bs.forEach((b,j)=>b.onclick=async()=>{if(lock)return;flash(j);if(j!==seq[i]){alive=false;lock=true;finish(seq.length-1,2);return}i++;if(i===seq.length){$("gs").textContent=seq.length;lock=true;await wait(500);if(alive)round()}});
 stop=()=>{alive=false};round()}
function bath(){
 const c=cs(),s=cur(c),N=3+Math.round((100-s.clean)/15);let left=N;
 $("mb").innerHTML='<h2>🛁 Frotte les taches avec ton doigt !</h2><div id="bath">'+catBox(c,s)+'</div><p class="sub" id="gm">'+N+' taches</p>';
 const B=$("bath");
 for(let i=0;i<N;i++){const d=document.createElement("button");d.className="dirt";d.dataset.h=3;d.style.left=22+Math.random()*52+"%";d.style.top=18+Math.random()*60+"%";
  const rub=()=>{if(!d.isConnected)return;d.dataset.h--;d.style.opacity=d.dataset.h/3+.1;d.textContent="🫧";if(d.dataset.h<=0){d.remove();left--;$("gm").textContent=left?left+" taches":"Nickel !";if(!left)done()}};
  d.onpointerenter=rub;d.onclick=rub;B.appendChild(d)}
 async function done(){const ok=await tx((n,c)=>{apply(c,{clean:60,joy:-5});return "a été lavé 🛁"},"🫧");if(ok)setTimeout(closeModal,700)}}

document.addEventListener("click",async e=>{
 const b=e.target.closest("button,a");if(!b)return;const q=b.dataset;
 if(q.au){e.preventDefault();
  if(q.au==="sw"){mode=mode==="up"?"in":"up";render()}
  else if(q.au==="out")signOut(auth);
  else{const em=$("em").value.trim(),pw=$("pw").value;try{if(mode==="up"){const r=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(r.user,{displayName:($("ps").value.trim()||em.split("@")[0]).slice(0,20)});user=auth.currentUser;render()}else await signInWithEmailAndPassword(auth,em,pw)}catch(x){toast({"auth/invalid-credential":"E-mail ou mot de passe incorrect","auth/email-already-in-use":"Cet e-mail a déjà un compte","auth/weak-password":"Mot de passe trop court","auth/invalid-email":"E-mail invalide"}[x.code]||x.code||"Erreur")}}return}
 if(!user)return;
 if(q.x!==undefined)closeModal();
 else if(q.coat){coatSel=+q.coat;render()}
 else if(q.adopt!==undefined){const t=Date.now(),old=D?D.cats.map(c=>({n:c.name,a:Math.floor(age(c)),w:why(c)||"…"})):[];
  setDoc(ref,{cats:[{id:uid(),name:chosenName.trim()||"Minou",born:t,t,life:36+Math.floor(Math.random()*13),food:80,joy:80,energy:80,clean:80,k:coatSel,wear:{},mated:false}],coins:D?D.coins||0:10,inv:D?D.inv:{kib:2},own:D?D.own:{},past:((D?D.past:[])||[]).concat(old).slice(-10),log:[{w:who(),x:"a adopté un chaton 🐱",t}]}).catch(x=>toast("Erreur : "+x.code))}
 else if(q.sel){sel=q.sel;render()}
 else if(q.m){meet=[];openModal({feed:feedUI,play:playUI,shop:shopUI,meet:meetUI,wash:bath}[q.m])}
 else if(q.a)tx((n,c)=>{apply(c,{energy:40,food:-5});return "a fait dodo 😴"},"💤");
 else if(q.f){const f=FOODS[q.f];if(await tx((n,c)=>{if(!(n.inv[q.f]>0))throw Error("Plus de "+f.n);n.inv[q.f]--;apply(c,f.d);return "a mangé "+f.n+" "+f.e},f.e))closeModal()}
 else if(q.b){const[t,k]=q.b.split(":"),it=t==="f"?FOODS[k]:ACC[k];tx((n,c)=>{if((n.coins||0)<it.p)throw Error("Pas assez de pièces");n.coins-=it.p;if(t==="f")n.inv[k]=(n.inv[k]||0)+1;else{n.own[k]=true;c.wear[k]=true}return "a reçu "+it.n+" "+it.e},"🪙")}
 else if(q.w)tx((n,c)=>{c.wear[q.w]=!c.wear[q.w];return (c.wear[q.w]?"porte ":"ne porte plus ")+ACC[q.w].n});
 else if(q.g){modalFn=null;q.g==="mouse"?tapGame("🐭"):q.g==="fish"?tapGame("🐟","👢"):simon()}
 else if(q.mt!==undefined){const m=meet[+q.mt],nm=prompt("Comment s’appelle le chaton ?","Petit "+(cs().name))||"Bébé";
  if(await tx((n,c)=>{if(c.mated)throw Error("Déjà papa");if(n.cats.length>=4)throw Error("Maximum 4 chats");c.mated=true;const t=Date.now();n.cats.push({id:uid(),name:nm.slice(0,20),born:t,t,life:36+Math.floor(Math.random()*13),food:80,joy:80,energy:80,clean:80,k:Math.random()<.5?(c.k||0):m.k,wear:{},mated:false});return "a rencontré "+m.n+" 💕 : "+nm+" est né !"},"💕"))closeModal()}
});

try{
 if(!firebaseConfig.apiKey.startsWith("COLLE")){
  const ap=initializeApp(firebaseConfig);auth=getAuth(ap);db=getFirestore(ap);ref=doc(db,"pets","family");
  onAuthStateChanged(auth,u=>{user=u;if(unsub){unsub();unsub=null}D=null;
   if(u)unsub=onSnapshot(ref,sn=>{D=sn.exists()?sn.data():null;const a=document.activeElement;if(!(a&&a.tagName==="INPUT"&&a.value))render();if(modalFn)modalFn()},e=>{$("app").innerHTML='<div class="card msg">Connexion impossible ('+esc(e.code||"erreur")+'). Vérifie les règles Firestore.</div>'});
   render()})}
}catch(e){}
setInterval(()=>{const a=document.activeElement;if(user&&!(a&&a.tagName==="INPUT")&&!modalFn&&!stop)render()},30000);
render();
